<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposta Comercial — Roga Village</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#4E6747; --verde-esc:#3A4F35; --verde-cl:#E9EEE6;
  --ouro:#AC994E; --ouro-cl:#F4F0E1;
  --tinta:#23291F; --sub:#5E6658; --linha:#D9DDD3; --fundo:#EEF0EA; --papel:#FFFFFF;
  --alerta:#B5541C; --alerta-cl:#FBEDE3; --info:#2F6A8A; --info-cl:#E5F0F6; --ok:#3E7D3A;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--fundo);color:var(--tinta);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Jost,Inter,sans-serif;font-weight:500;margin:0}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--verde-esc);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.topbar .marca{display:flex;align-items:center;gap:10px;margin-right:auto;font-family:Jost,sans-serif;letter-spacing:.04em}
.topbar .marca img{width:30px;height:30px;background:#fff;border-radius:6px;padding:2px}
.topbar .marca small{opacity:.7;font-family:Inter,sans-serif;letter-spacing:0}
.btn{border:1px solid transparent;border-radius:8px;padding:7px 12px;cursor:pointer;background:#fff;color:var(--verde-esc);font-weight:500;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ouro{background:var(--ouro);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.line{background:#fff;border-color:var(--linha);color:var(--tinta)}
.btn.danger{color:var(--alerta)}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;max-width:1340px;margin:20px auto;padding:0 16px;align-items:start}
@media (max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* ---------- folha (proposta) ---------- */
.folha{background:var(--papel);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.05);padding:40px 44px;min-width:0}
@media (max-width:700px){.folha{padding:22px 16px}}
.cab{display:flex;gap:24px;align-items:flex-start;border-bottom:2px solid var(--ouro);padding-bottom:18px;margin-bottom:18px}
.cab img{width:92px;height:92px;flex:none}
.cab .tit{flex:1;min-width:0}
.cab h1{font-size:28px;color:var(--verde);letter-spacing:.02em}
.cab .numero{text-align:right;font-family:Jost,sans-serif;color:var(--sub);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.cab .numero .n{font-size:20px;color:var(--tinta);letter-spacing:0}
.cab .numero input{width:120px;text-align:right;font-size:20px}
.grid-dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;margin-top:10px}
@media (max-width:700px){.grid-dados{grid-template-columns:1fr}.cab{flex-wrap:wrap}.cab .tit{flex-basis:100%;order:3}.cab .numero{margin-left:auto}}
.campo{display:flex;align-items:baseline;gap:8px;min-width:0;padding:2px 0}
.campo label{flex:none;color:var(--sub);font-size:12.5px;min-width:74px}
.campo .f{flex:1;min-width:0}
.aviso-bloqueio{background:var(--ouro-cl);border-left:3px solid var(--ouro);padding:8px 12px;font-size:12.5px;margin:14px 0 6px;color:#5d5326}

.evento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 8px}
@media (max-width:800px){.evento{grid-template-columns:repeat(2,minmax(0,1fr))}}
.evento .box{border:1px solid var(--linha);border-radius:6px;padding:8px 10px;min-width:0}
.evento .box .r{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.evento .box .v{font-weight:600;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.evento .box .v input,.evento .box .v select{font-weight:600}

/* inputs que viram texto na impressão */
.in{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 4px;width:100%;min-width:0;outline:none;transition:background .15s,border-color .15s}
.in:hover{background:#F6F7F3;border-color:var(--linha)}
.in:focus{background:#fff;border-color:var(--ouro);box-shadow:0 0 0 2px rgba(172,153,78,.18)}
input.in[type=number]{text-align:right}
input.in.num,input.in.money{text-align:right}
select.in{cursor:pointer}
.ce{outline:none;border-radius:4px;padding:2px 4px;border:1px solid transparent;white-space:pre-wrap;min-height:1.4em}
.ce:hover{background:#F6F7F3;border-color:var(--linha)}
.ce:focus{background:#fff;border-color:var(--ouro)}
.ce:empty::before{content:attr(data-ph);color:#A2A79C}
.pv{display:none}
.auto{font-size:10.5px;color:var(--ouro);margin-left:2px;cursor:help}

/* seções */
.secao{margin-top:26px;break-inside:auto}
.secao h2{font-size:16px;color:#fff;background:var(--verde);padding:7px 12px;border-radius:4px 4px 0 0;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.secao h2 .btn{font-family:Inter,sans-serif;text-transform:none;letter-spacing:0}
.tabela-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{background:var(--verde-cl);color:var(--verde-esc);font-weight:600;text-align:left;padding:6px 6px;font-size:11.5px;border-bottom:1px solid var(--linha);vertical-align:bottom}
table.t th.r,table.t td.r{text-align:right}
table.t td.r{white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px solid var(--linha);vertical-align:top}
table.t tr{break-inside:avoid}
table.t td.tot{font-weight:600;white-space:nowrap;padding-top:8px}
table.t .item-tit{font-weight:600}
table.t .desc{color:var(--sub);font-size:12px}
table.t td.acao{width:26px;padding:4px 0}
.rm{border:none;background:transparent;color:#B9BDB2;cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:4px}
.rm:hover{color:var(--alerta);background:var(--alerta-cl)}
tr.zerado td{opacity:.55}
tr.sub td{background:#FAFBF8;font-weight:500;border-bottom:none}
tr.total td{background:var(--ouro-cl);font-weight:700;color:var(--verde-esc);font-family:Jost,sans-serif;font-size:14px}
.minpax{font-size:11px;color:var(--ouro);display:block;white-space:nowrap}
.minpax-edit{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap}
.minpax-edit input{width:46px;font-size:11px;padding:0 2px}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--verde-cl);color:var(--verde-esc);margin-left:4px;font-weight:500;vertical-align:middle}
.tag.warn{background:var(--alerta-cl);color:var(--alerta)}

.grande-total{margin-top:26px;border:2px solid var(--verde);border-radius:6px;overflow:hidden}
.grande-total .linha{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;border-bottom:1px solid var(--linha);align-items:center}
.grande-total .linha.final{background:var(--verde);color:#fff;font-family:Jost,sans-serif;font-size:20px;border:none;padding:12px 14px}
.grande-total .linha.desc-l{color:var(--alerta)}

.textos{margin-top:26px;display:grid;gap:14px}
.textos .bloco h3{font-size:13.5px;color:var(--verde);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.textos .bloco .ce{font-size:12.6px;color:#3a4036}
.bloco.oculto{opacity:.4}
.bloco.oculto .ce{display:none}
.contato{margin-top:26px;padding-top:14px;border-top:2px solid var(--ouro);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.contato img{width:54px;height:54px}
.contato .ce{font-size:13px}

/* ---------- painel ---------- */
.painel{position:sticky;top:64px;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);max-height:calc(100vh - 84px);display:flex;flex-direction:column;min-width:0}
@media (max-width:1100px){.painel{position:static;max-height:none}}
.abas{display:flex;border-bottom:1px solid var(--linha);overflow-x:auto}
.abas button{flex:1;border:none;background:none;padding:11px 6px;cursor:pointer;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.abas button.on{color:var(--verde-esc);border-bottom-color:var(--ouro)}
.abas .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--alerta);color:#fff;font-size:11px;margin-left:3px}
.abas .badge.zero{background:var(--ok)}
.conteudo{overflow:auto;padding:14px 16px 20px}
.conteudo h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--verde);margin:16px 0 8px}
.conteudo h3:first-child{margin-top:0}
.q{border:1px solid var(--linha);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.q .qt{font-size:13px;font-weight:500;margin-bottom:5px}
.q .qt small{display:block;font-weight:400;color:var(--sub);font-size:11.5px}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;padding:3px 10px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--linha)}
.seg button.on{background:var(--verde);color:#fff}
.q textarea{width:100%;margin-top:6px;border:1px solid var(--linha);border-radius:4px;padding:4px 6px;font-size:12.5px;resize:vertical;min-height:30px}
.alerta{border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12.8px;border-left:3px solid}
.alerta.a{background:var(--alerta-cl);border-color:var(--alerta)}
.alerta.i{background:var(--info-cl);border-color:var(--info)}
.alerta b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.alerta .ref{display:block;font-size:11px;color:var(--sub);margin-top:3px}
.vazio{color:var(--ok);font-size:13px;padding:8px 0}
.cfg{display:grid;grid-template-columns:1fr 110px;gap:6px 10px;align-items:center;font-size:13px}
.cfg input[type=number]{width:100%;border:1px solid var(--linha);border-radius:4px;padding:4px 6px;text-align:right}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;cursor:pointer}
.chk input{margin-top:3px}
.lista-orc{display:grid;gap:6px}
.lista-orc .o{border:1px solid var(--linha);border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lista-orc .o .nm{font-weight:500;font-size:13px}
.lista-orc .o small{color:var(--sub);display:block;font-size:11.5px}
.lista-orc .o.atual{border-color:var(--ouro);background:var(--ouro-cl)}
.resumo-vend{background:var(--verde-cl);border-radius:6px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.resumo-vend b{text-align:right}
.ajuda{font-size:12px;color:var(--sub)}

/* ---------- catálogo ---------- */
dialog{border:none;border-radius:10px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,35,28,.45)}
.dlg-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha);background:var(--verde-cl);flex-wrap:wrap}
.dlg-cab h3{color:var(--verde-esc)}
.dlg-corpo{padding:12px 18px 18px;overflow:auto;max-height:calc(100vh - 160px)}
.cat-grupo{margin-top:12px}
.cat-grupo h4{margin:0 0 6px;font:600 11.5px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ouro)}
.cat-item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:8px 10px;border:1px solid var(--linha);border-radius:6px;margin-bottom:6px;cursor:pointer}
.cat-item:hover{border-color:var(--ouro);background:#FDFCF7}
.cat-item .nm{font-weight:600}
.cat-item .ds{font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-item .pr{white-space:nowrap;font-weight:600;color:var(--verde-esc);text-align:right}
.cat-item .pr small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--verde-esc);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}

/* ---------- impressão / PDF ---------- */
@page{size:A4;margin:12mm 11mm 14mm}
@media print{
  body{background:#fff;font-size:11.5px}
  .topbar,.painel,.no-print,.rm,.acao,.btn,dialog,.toast,.auto,.minpax-edit{display:none !important}
  .wrap{display:block;margin:0;padding:0;max-width:none}
  .folha{box-shadow:none;padding:0;border-radius:0}
  .in{display:none !important}
  .pv{display:inline}
  .ce{border:none;padding:0}
  .ce:empty{display:none}
  tr.zerado.ocultar,.oculta-print,.bloco.oculto{display:none !important}
  .secao h2,table.t th,tr.total td,.grande-total .linha.final,.aviso-bloqueio,tr.sub td,.evento .box{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .secao{break-inside:auto}
  .secao h2{break-after:avoid}
  .grande-total,.contato,.textos .bloco{break-inside:avoid}
  .tabela-wrap{overflow:visible}
  tr.zerado td{opacity:1}
  .evento{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid-dados{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cab{flex-wrap:nowrap}
  table.t{font-size:10.8px}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="marca"><img id="tb-logo" alt=""><div>Orçamentos de Eventos<br><small id="tb-status">—</small></div></div>
  <button class="btn ghost" data-act="novo">Novo</button>
  <button class="btn ghost" data-act="duplicar">Duplicar</button>
  <button class="btn ghost" data-act="salvar">Salvar</button>
  <button class="btn ouro" data-act="pdf">Exportar PDF</button>
</header>

<div class="wrap">
  <main class="folha" id="folha"></main>
  <aside class="painel no-print">
    <nav class="abas" id="abas">
      <button data-aba="briefing" class="on">Briefing</button>
      <button data-aba="checagens">Checagens <span class="badge" id="badge">0</span></button>
      <button data-aba="ajustes">Ajustes</button>
      <button data-aba="arquivo">Arquivo</button>
    </nav>
    <div class="conteudo" id="painel"></div>
  </aside>
</div>

<dialog id="dlg">
  <div class="dlg-cab"><h3 id="dlg-tit">Adicionar item</h3><div id="dlg-extra"></div><button class="btn line sm" data-act="fechar-dlg">Fechar</button></div>
  <div class="dlg-corpo" id="dlg-corpo"></div>
</dialog>
<div class="toast" id="toast"></div>
<input type="file" id="arq-import" accept="application/json,.json" hidden>

/* =====================================================================
   5. CÁLCULO (regras de preço do Guia)
   ===================================================================== */
function minimoAB(r){
  if (r.minOverride != null && r.minOverride !== "") return num(r.minOverride);
  const minDur = r.dur && TABELA.duracoes[r.dur] ? TABELA.duracoes[r.dur].min : 0;
  // Guia §8: alimentação fatura no mínimo 50 pessoas; a tabela pode exigir mais (5h = 100 pax)
  return r.tipo === "bebida" ? Math.max(minDur, 20) : Math.max(num(S.cfg.minPax), minDur);
}
function calc(){
  const c = { hosp:{}, ab:{}, serv:{}, exp:{} };
  let subH = 0, baseIssH = 0, pessoasH = 0, acomH = 0;
  S.hosp.forEach(r => { const t = num(r.valor) * num(r.qtd) * num(r.diarias); c.hosp[r.id] = t; subH += t; if (r.tabela === "evento") baseIssH += t; pessoasH += num(r.pessoas); acomH += num(r.qtd); });
  const issH = baseIssH * num(S.cfg.issHosp) / 100;
  let totAB = 0;
  S.ab.forEach(r => { const pax = num(r.pax); const min = minimoAB(r); const fat = pax > 0 ? Math.max(pax, min) : 0; const t = num(r.valor) * fat; c.ab[r.id] = {t, fat, min, aplicouMin: pax > 0 && fat > pax}; totAB += t; });
  let subS = 0, baseIssS = 0;
  S.serv.forEach(r => { const t = num(r.valor) * num(r.qtd); c.serv[r.id] = t; subS += t; if (r.iss) baseIssS += t; });
  const issS = baseIssS * num(S.cfg.issServ) / 100;
  let totE = 0;
  S.exp.forEach(r => { const t = num(r.valor) * num(r.pax); c.exp[r.id] = t; totE += t; });
  const totH = subH + issH, totS = subS + issS;
  const bruto = totH + totAB + totS + totE;
  const desc = S.desconto.tipo === "pct" ? bruto * num(S.desconto.valor) / 100 : num(S.desconto.valor);
  const total = Math.max(0, bruto - desc);
  // diárias do evento (cabeçalho)
  const diariasEvento = S.meta.formato === "pernoite" ? (noites(S.meta.checkin, S.meta.checkout) ?? 0) : (S.meta.checkin ? 1 : 0);
  return Object.assign(c, { subH, issH, totH, pessoasH, acomH, totAB, subS, issS, totS, totE, bruto, desc, total, diariasEvento });
}

/* =====================================================================
   6. CHECAGENS — o Guia de Composição transformado em regras
   ===================================================================== */
function checagens(C){
  const A = []; const add = (nivel, tit, txt, ref) => A.push({nivel, tit, txt, ref});
  const m = S.meta, b = S.briefing, resp = k => (b[k] && b[k].r) || "";
  if (!m.empresa) add("a", "Dados do cliente", "Preencha a empresa antes de enviar a proposta.");
  if (!num(m.pessoas)) add("a", "Nº de pessoas", "Informe a quantidade de participantes — ela define mínimos, hospedagem e experiências.", "Guia §2");
  if (!m.checkin) add("a", "Data do evento", "Informe a data de check-in / início do evento.");

  // Horários (§5 e §6)
  const h = s => s ? +s.split(":")[0] + (+s.split(":")[1] || 0)/60 : null;
  if (m.formato === "dayuse"){
    if ((h(m.checkinHora) ?? 8) < 8 || (h(m.checkoutHora) ?? 22) > 22) add("a", "Horário fora do padrão (Day Use)", "Referência de 1 diária é 08h às 22h. Período diferente deve ser avaliado comercialmente e pode ajustar a proposta.", "Guia §5");
    if (m.checkout && m.checkin && m.checkout !== m.checkin) add("i", "Day Use com mais de um dia", "As datas de início e fim são diferentes. Se houver pernoite, mude o formato para Pernoite.");
  } else {
    if (m.checkinHora && h(m.checkinHora) < 15) add("a", "Check-in antecipado", "Check-in padrão é a partir das 15h (sala a partir das 08h). Antecipação exige análise e ajuste comercial — considere locação de sala/espaço.", "Guia §6");
    if (m.checkoutHora && h(m.checkoutHora) > 13) add("a", "Check-out posterior", "Check-out padrão é às 13h. Uso prolongado deve ser analisado e pode gerar locação adicional de sala/espaço.", "Guia §6");
    if (!S.hosp.length) add("i", "Pernoite sem hospedagem", "O evento está como Pernoite, mas não há hospedagem lançada.");
  }
  // Locação: evitar cobrança duplicada (§4)
  const espacos = S.serv.filter(r => r.espaco && num(r.qtd) > 0 && num(r.valor) > 0);
  if (m.exclusividade && espacos.length) add("a", "Possível cobrança duplicada de espaço", "O cliente está locando todas as acomodações e há locação de espaço lançada. Não acrescentar locação automaticamente — analisar conforme a composição do evento.", "Guia §4, ex. 1");
  const porData = {}; espacos.forEach(r => { const k = r.data || "sem data"; (porData[k] = porData[k] || []).push(r.nome); });
  Object.entries(porData).forEach(([d, nomes]) => { if (nomes.length > 1) add("a", "Dois espaços na mesma data", `${nomes.join(" + ")} em ${d === "sem data" ? "data não informada" : dataBR(d)}. Confirme que não é o mesmo uso cobrado duas vezes.`, "Guia §4, ex. 2"); });
  // Montagem (§7)
  if (resp("montagem") === "sim" || S.serv.some(r => r.k === "montagem")) add("i", "Montagem antecipada", "Só 1 dia antes e mediante disponibilidade operacional. Confirme com a operação antes de prometer ao cliente.", "Guia §7");
  // Hospedagem: capacidade e preço
  S.hosp.forEach((r, i) => {
    const cap = TABELA.capacidade[r.acomod] || 1; const p = num(r.pessoas), q = num(r.qtd);
    if (p > q * cap) add("a", `Hospedagem linha ${i+1}: faltam acomodações`, `${p} pessoas em ${q} cubo(s) ${TABELA.nomeAcomod[r.acomod].toLowerCase()} (capacidade ${q*cap}). Sugestão: ${Math.ceil(p/cap)} acomodações.`);
    if (r.ref && num(r.valor) < r.ref) add("a", `Hospedagem linha ${i+1}: abaixo da tabela`, `${brl(r.valor)} contra ${brl(r.ref)} na tabela. Valor abaixo da tabela exige autorização prévia da Gerência.`, "Guia §3 e §16");
    const n = noites(r.checkin, r.checkout); if (n != null && n !== num(r.diarias)) add("i", `Hospedagem linha ${i+1}: diárias`, `As datas somam ${n} diária(s), mas a linha está com ${num(r.diarias)}.`);
  });
  if (S.hosp.length && num(m.pessoas) && C.pessoasH && C.pessoasH !== num(m.pessoas)) add("i", "Pessoas hospedadas × participantes", `${C.pessoasH} hospedados para ${num(m.pessoas)} participantes. Confira se é intencional.`);
  // A&B (§8)
  S.ab.forEach(r => {
    const c = C.ab[r.id]; if (!c) return;
    if (r.ref && num(r.valor) < r.ref) add("a", `${r.nome || "A&B"}: abaixo da tabela`, `${brl(r.valor)} por pessoa contra ${brl(r.ref)} (${r.dur}) na tabela. Exige autorização da Gerência.`, "Guia §3 e §16");
    if (r.minOverride != null && r.minOverride !== "" && num(r.minOverride) < (r.tipo === "bebida" ? 20 : num(S.cfg.minPax))) add("a", `${r.nome || "A&B"}: mínimo reduzido manualmente`, "Mínimo abaixo da política. Registrar a autorização da Gerência.", "Guia §8 e §16");
  });
  const comMin = S.ab.filter(r => C.ab[r.id] && C.ab[r.id].aplicouMin);
  if (comMin.length) add("i", "Mínimo comercial aplicado", `${comMin.map(r => `${r.nome || "item"} (${num(r.pax)} → ${C.ab[r.id].fat})`).join(", ")}. Não orçar multiplicando o valor individual pelo número real de pessoas.`, "Guia §8");
  if (!S.ab.length && num(m.pessoas)) add("i", "Sem Alimentos & Bebidas", "Nenhuma refeição lançada. Confirme com o cliente.", "Guia §8");
  // Bebidas (§9)
  const temBebida = S.ab.some(r => r.tipo === "bebida" || /bebida/i.test(r.nome));
  if (!resp("bebidas")) add("a", "Bebidas não verificadas", "Pergunte sobre pacote de bebidas, bebidas nas refeições, Happy Hour, confraternização e necessidade de bar.", "Guia §9");
  else if (resp("bebidas") === "sim" && !temBebida) add("a", "Bebidas confirmadas, mas não orçadas", "O briefing diz que haverá bebidas e nenhum pacote foi lançado.", "Guia §9");
  if (resp("happy") === "sim" && !temBebida) add("a", "Happy Hour sem pacote de bebidas", "Happy Hour confirmado sem bebidas no orçamento.", "Guia §9");
  // Banda / DJ (§10, §11)
  ["banda","dj","happy"].forEach(k => { if (!resp(k)) add("a", `Pergunta obrigatória: ${k === "dj" ? "DJ" : k === "banda" ? "Banda" : "Happy Hour"}`, "Banda, DJ e Happy Hour interferem em sonorização, iluminação, palco, equipe técnica, rider, bebidas e horário.", "Guia §10"); });
  const temItem = re => S.serv.some(r => re.test(r.nome + " " + r.k));
  if (resp("banda") === "sim" && !temItem(/banda/i)) add("a", "Banda confirmada e não orçada", "Lance a banda e a estrutura técnica a partir do rider técnico-base.", "Guia §11");
  if (resp("banda") === "sim" && !temItem(/rider|equip/i)) add("a", "Banda sem rider técnico", "Dimensione sonorização, iluminação e palco pelo rider técnico-base do Roga Village.", "Guia §11");
  if (resp("dj") === "sim" && !temItem(/\bdj\b/i)) add("a", "DJ confirmado e não orçado", "O briefing diz que haverá DJ.", "Guia §10");
  // Sob consulta com valor zero
  [...S.serv, ...S.exp].forEach(r => { if ((r.qtd ?? r.pax) && !num(r.valor)) add("i", `${r.nome}: valor sob consulta`, "Item sem valor. Defina o preço com a Gerência/operação antes de enviar."); });
  // Team Building (§13, §14)
  if (resp("teambuilding") === "sim" && !S.exp.some(r => num(r.pax) > 0)) add("a", "Team Building sem experiência", "Não trate como contratação de sala: inclua Experiências Roga (Mountain Trail, Floating, Jantar Harmonizado, wellness…).", "Guia §13");
  if (S.exp.some(r => r.k === "personalizada")) add("i", "Experiência personalizada", "Não prometer experiência exclusiva antes da validação da operação.", "Guia §14");
  // Desconto (§16)
  if (C.desc > 0) add("a", "Desconto comercial", `Desconto de ${brl(C.desc)}${S.desconto.aprovadoPor ? " — aprovado por " + S.desconto.aprovadoPor : " sem aprovação registrada"}. Toda exceção passa pela Gerência.`, "Guia §16");
  return A;
}

// Campo editável que vira texto limpo no PDF
function F(path, o={}){
  const v = getP(S, path); const t = o.t || "text";
  let input, pv;
  if (t === "money"){ input = `<input class="in money ${o.cls||""}" data-k="${path}" data-t="money" inputmode="decimal" value="${esc(nBR.format(num(v)))}">`; pv = brl(v); }
  else if (t === "num"){ input = `<input class="in num ${o.cls||""}" data-k="${path}" data-t="num" type="number" min="0" step="${o.step||1}" value="${esc(num(v))}" style="${o.w ? "width:"+o.w : ""}">`; pv = String(num(v)); }
  else if (t === "date"){ input = `<input class="in ${o.cls||""}" data-k="${path}" data-t="date" type="date" value="${esc(v)}">`; pv = dataBR(v) || o.vazio || ""; }
  else if (t === "time"){ input = `<input class="in ${o.cls||""}" data-k="${path}" data-t="time" type="time" value="${esc(v)}" style="width:${o.w||"108px"}">`; pv = v ? v.replace(":00","h").replace(":", "h") : ""; }
  else if (t === "select"){ input = `<select class="in ${o.cls||""}" data-k="${path}" data-t="select">${o.opts.map(([k,l]) => `<option value="${k}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`; pv = (o.opts.find(x => x[0] === v) || ["",""])[1]; }
  else { input = `<input class="in ${o.cls||""}" data-k="${path}" data-t="text" value="${esc(v)}" placeholder="${esc(o.ph||"")}">`; pv = esc(v); }
  return `${input}<span class="pv" data-pv="${path}">${o.pvFmt ? o.pvFmt(v) : pv}</span>`;
}

  S.exp.forEach(r => { const e = document.querySelector(`[data-tot="exp.${r.id}"]`); if (e){ e.textContent = brl(C.exp[r.id]); e.parentElement.classList.toggle("zerado", !C.exp[r.id]); } });
  [...S.hosp, ...S.ab, ...S.serv].forEach(r => { const e = document.querySelector(`[data-abaixo="${r.id}"]`); if (e) e.hidden = !(r.ref && num(r.valor) < r.ref); });
  set("acomH", C.acomH || "-"); set("acomH2", C.acomH); set("pessoasH", C.pessoasH); set("diarias", C.diariasEvento || "-");
  set("subH", brl(C.subH)); set("issH", brl(C.issH)); set("totH", brl(C.totH)); set("totAB", brl(C.totAB));
  set("issS", brl(C.issS)); set("totS", brl(C.totS)); set("totE", brl(C.totE));
  set("gH", brl(C.totH)); set("gAB", brl(C.totAB)); set("gS", brl(C.totS)); set("gE", brl(C.totE)); set("gD", "− " + brl(C.desc)); set("total", brl(C.total));
  set("notaMin", S.ab.some(r => C.ab[r.id].aplicouMin) ? `* Serviços de alimentação com faturamento mínimo equivalente a ${num(S.cfg.minPax)} pessoas (ou o mínimo da duração contratada).` : "");
  renderPainel(C);
}

/* =====================================================================
   8. PAINEL DO VENDEDOR (não sai no PDF)
   ===================================================================== */
function renderPainel(C){
  C = C || calc();
  const A = checagens(C); const nA = A.filter(a => a.nivel === "a").length;
  const bd = $("#badge"); bd.textContent = nA; bd.classList.toggle("zero", nA === 0);
  document.querySelectorAll("#abas button").forEach(b => b.classList.toggle("on", b.dataset.aba === abaAtual));
  const P = $("#painel"); let h = "";
  if (abaAtual === "briefing"){
    h += `<p class="ajuda" style="margin-top:0">Antes de montar a proposta, entenda o evento (Guia §2). Estas respostas alimentam as checagens e não aparecem no PDF.</p>`;
    let g = "";
    BRIEFING.forEach(q => { if (q.g !== g){ g = q.g; h += `<h3>${g}</h3>`; } const b = S.briefing[q.k] || {}; h += `<div class="q"><div class="qt">${q.q}<small>${q.h}</small></div>
      <div class="seg">${[["sim","Sim"],["nao","Não"],["nd","A definir"]].map(([k,l]) => `<button data-act="brief" data-q="${q.k}" data-r="${k}" class="${b.r === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <textarea data-brief="${q.k}" rows="1" placeholder="Observações">${esc(b.n || "")}</textarea></div>`; });
  } else if (abaAtual === "checagens"){
    h += `<div class="resumo-vend"><span>Total do orçamento</span><b>${brl(C.total)}</b>
      <span>Por participante</span><b>${num(S.meta.pessoas) ? brl(C.total / num(S.meta.pessoas)) : "—"}</b>
      <span>A&amp;B por participante</span><b>${num(S.meta.pessoas) ? brl(C.totAB / num(S.meta.pessoas)) : "—"}</b></div><h3>Pontos de atenção</h3>`;
    h += A.length ? A.map(a => `<div class="alerta ${a.nivel}"><b>${esc(a.tit)}</b>${esc(a.txt)}${a.ref ? `<span class="ref">${a.ref}</span>` : ""}</div>`).join("") : `<div class="vazio">✓ Nenhum ponto pendente. Proposta pronta para envio.</div>`;
    h += `<p class="ajuda">Laranja = resolver ou aprovar com a Gerência antes de enviar. Azul = conferir.</p>`;
  } else if (abaAtual === "ajustes"){
    h += `<h3>Política de preço</h3><div class="cfg">
      <label>Mínimo comercial de alimentação (pax)</label><input type="number" min="0" data-k="cfg.minPax" data-t="num" value="${num(S.cfg.minPax)}">
      <label>ISS sobre hospedagem eventos (%)</label><input type="number" min="0" step="0.5" data-k="cfg.issHosp" data-t="num" value="${num(S.cfg.issHosp)}">
      <label>ISS sobre serviços marcados (%)</label><input type="number" min="0" step="0.5" data-k="cfg.issServ" data-t="num" value="${num(S.cfg.issServ)}"></div>
      <p class="ajuda">Tabela de Preços: ISS 2% à parte nas diárias de evento; Lazer com ISS embutido. O modelo antigo usava 4% — confirme a alíquota com o financeiro.</p>
      <h3>Desconto comercial</h3><div class="cfg">
      <label>Tipo</label><select data-k="desconto.tipo" data-t="select" style="border:1px solid var(--linha);border-radius:4px;padding:4px"><option value="pct" ${S.desconto.tipo === "pct" ? "selected" : ""}>% do total</option><option value="rs" ${S.desconto.tipo === "rs" ? "selected" : ""}>R$</option></select>
      <label>Valor</label><input type="number" min="0" step="0.01" data-k="desconto.valor" data-t="num" value="${num(S.desconto.valor)}"></div>
      <div style="margin-top:6px;display:grid;gap:6px"><input class="in" style="border-color:var(--linha)" data-k="desconto.motivo" data-t="text" placeholder="Motivo (aparece no PDF)" value="${esc(S.desconto.motivo)}">
      <input class="in" style="border-color:var(--linha)" data-k="desconto.aprovadoPor" data-t="text" placeholder="Aprovado por (Gerência) — interno" value="${esc(S.desconto.aprovadoPor)}"></div>
      <h3>PDF</h3>
      <label class="chk"><input type="checkbox" data-k="cfg.ocultarZerados" data-t="bool" ${S.cfg.ocultarZerados ? "checked" : ""}> Ocultar itens e seções zerados no PDF</label>
      <label class="chk"><input type="checkbox" data-k="cfg.mostrarAvisoBloqueio" data-t="bool" ${S.cfg.mostrarAvisoBloqueio ? "checked" : ""}> Mostrar aviso “não implica bloqueio”</label>
      <p class="ajuda">Os blocos de texto do fim da proposta podem ser ligados/desligados pela caixa “incluir” de cada um e editados clicando no texto.</p>
      <button class="btn line sm" data-act="textos-padrao">Restaurar textos padrão</button>`;
  } else {
    const lista = lsGet(LS_LISTA, {}); const itens = Object.values(lista).sort((a,b) => (b.atualizado||"").localeCompare(a.atualizado||""));
    h += `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn line sm" data-act="salvar">Salvar neste navegador</button><button class="btn line sm" data-act="exportar">Baixar arquivo (.json)</button><button class="btn line sm" data-act="importar">Abrir arquivo…</button><button class="btn line sm" data-act="exemplo">Carregar exemplo</button></div>
      <p class="ajuda">Salvar guarda o orçamento neste navegador. Para guardar em rede, enviar a um colega ou trocar de computador, use “Baixar arquivo” e depois “Abrir arquivo…”.</p>
      <h3>Orçamentos salvos (${itens.length})</h3><div class="lista-orc">`;
    h += itens.length ? itens.map(o => `<div class="o ${o.id === S.id ? "atual" : ""}"><div><div class="nm">${esc(o.numero)} — ${esc(o.meta.empresa || "sem empresa")}</div><small>${esc(o.meta.evento || "")} ${o.meta.checkin ? "· " + dataBR(o.meta.checkin) : ""} · ${brl(o._total)}</small></div>
      <div style="display:flex;gap:4px"><button class="btn line sm" data-act="abrir" data-id="${o.id}">Abrir</button><button class="btn line sm danger" data-act="excluir" data-id="${o.id}">×</button></div></div>`).join("") : `<p class="ajuda">Nenhum orçamento salvo ainda.</p>`;
    h += `</div>`;
  }
  // Não redesenha o painel enquanto o vendedor digita nele (preserva o cursor)
  const ativo = document.activeElement;
  if (ativo && P.contains(ativo) && /^(INPUT|TEXTAREA|SELECT)$/.test(ativo.tagName) && ativo.type !== "checkbox") return;
  P.innerHTML = h;
}

/* =====================================================================
   9. CATÁLOGO (diálogo "+ Adicionar")
   ===================================================================== */
let dlgLista = null, dlgDur = "2h";
function abrirCatalogo(lista){
  dlgLista = lista; const titulos = {hosp:"Adicionar hospedagem", ab:"Adicionar Alimentos & Bebidas", serv:"Adicionar serviço ou espaço", exp:"Adicionar Experiência Roga"};
  $("#dlg-tit").textContent = titulos[lista]; desenharCatalogo(); $("#dlg").showModal();
}
function desenharCatalogo(){
  const L = dlgLista; let h = ""; $("#dlg-extra").innerHTML = "";
  const item = (key, nome, ds, pr, sub) => `<div class="cat-item" data-act="pick" data-key="${key}"><div><div class="nm">${esc(nome)}</div><div class="ds">${esc(ds)}</div></div><div class="pr">${pr}${sub ? `<small>${sub}</small>` : ""}</div></div>`;
  if (L === "hosp"){
    ["evento","lazer"].forEach(tb => { h += `<div class="cat-grupo"><h4>Diária ${tb === "evento" ? "Eventos — ISS à parte" : "Lazer — ISS embutido"}</h4>`;
      Object.entries(TABELA.hospedagem[tb]).forEach(([ac, p]) => { if (!p) return; ["cafe","pc"].forEach(rg => { h += item(`${tb}|${ac}|${rg}`, `Cubo ${TABELA.nomeAcomod[ac]} — ${rg === "cafe" ? "com Café" : "Pensão Completa"}`, `até ${TABELA.capacidade[ac]} pessoa(s) por acomodação`, brl(p[rg]), "por acomodação / diária"); }); });
      h += `</div>`; });
  } else if (L === "ab"){
    $("#dlg-extra").innerHTML = `<div class="seg">${Object.entries(TABELA.duracoes).map(([k, d]) => `<button data-act="dur" data-dur="${k}" class="${dlgDur === k ? "on" : ""}">Duração ${d.rot}</button>`).join("")}</div>`;
    let g = ""; TABELA.ab.forEach(it => { if (it.g !== g){ if (g) h += `</div>`; g = it.g; h += `<div class="cat-grupo"><h4>${g}</h4>`; }
      const p = it.p[dlgDur]; h += p == null ? `<div class="cat-item" style="opacity:.45;cursor:not-allowed"><div><div class="nm">${esc(it.nome)}</div><div class="ds">Não disponível na duração ${dlgDur}</div></div><div class="pr">—</div></div>` : item(it.k, it.nome, it.d, brl(p), `por pessoa · mín. ${TABELA.duracoes[dlgDur].min} pax`); });
    h += `</div><div class="cat-grupo"><h4>Fora da tabela</h4>${item("livre", "Item livre / cardápio personalizado", "Descrição e valor definidos por você", "—")}</div>`;
  } else if (L === "serv"){
    h += `<div class="cat-grupo"><h4>Locação de espaço (Tabela de Preços)</h4>${TABELA.espacos.map(e => item(e.k, e.nome, e.det, brl(e.v), "por diária")).join("")}</div>`;
    h += `<div class="cat-grupo"><h4>Serviços (referência do modelo)</h4>${TABELA.servicos.map(e => item(e.k, e.nome, e.det, e.consulta ? "sob consulta" : brl(e.v))).join("")}</div>`;
    h += `<div class="cat-grupo"><h4>Outro</h4>${item("livre", "Item livre", "Descrição e valor definidos por você", "—")}</div>`;
  } else {
    h += `<div class="cat-grupo"><h4>Experiências Roga</h4>${TABELA.experiencias.map(e => item(e.k, e.nome, e.d, e.consulta ? "sob consulta" : brl(e.v), e.consulta ? "" : "por pessoa")).join("")}</div>`;
    h += `<div class="cat-grupo"><h4>Outro</h4>${item("livre", "Experiência livre", "Descrição e valor definidos por você", "—")}</div>`;
  }
  $("#dlg-corpo").innerHTML = h;
}
function escolher(key){
  const L = dlgLista, m = S.meta, pax = num(m.pessoas), data = m.checkin || "";
  if (L === "hosp"){
    const [tb, ac, rg] = key.split("|"); const v = TABELA.hospedagem[tb][ac][rg]; const cap = TABELA.capacidade[ac];
    const n = m.formato === "pernoite" ? (noites(m.checkin, m.checkout) || 1) : 1;
    S.hosp.push(hospRow({tabela:tb, acomod:ac, regime:rg, valor:v, ref:v, checkin:m.checkin, checkout:m.checkout, diarias:n, pessoas:pax, qtd:pax ? Math.ceil(pax/cap) : 0}));
  } else if (L === "ab"){
    if (key === "livre") S.ab.push(abRow({nome:"", data, pax}));
    else { const it = TABELA.ab.find(i => i.k === key); S.ab.push(abRow({k:it.k, dur:dlgDur, tipo:it.tipo, nome:it.nome, horario:`${TABELA.duracoes[dlgDur].rot} de duração`, d:it.d, data, pax, valor:it.p[dlgDur], ref:it.p[dlgDur]})); }
  } else if (L === "serv"){
    if (key === "livre") S.serv.push(servRow({data}));
    else { const e = TABELA.espacos.find(i => i.k === key), s = TABELA.servicos.find(i => i.k === key), it = e || s;
      S.serv.push(servRow({k:it.k, nome:it.nome, det:it.det, data, qtd:1, valor:it.v, ref:it.v || null, espaco:!!e, iss:!!e})); }
  } else {
    if (key === "livre") S.exp.push(expRow({pax}));
    else { const it = TABELA.experiencias.find(i => i.k === key); S.exp.push(expRow({k:it.k, nome:it.nome, d:it.d, pax, valor:it.v, ref:it.v || null})); }
  }
  $("#dlg").close(); mudou(true); toast("Item adicionado");
}

/* =====================================================================
   10. EVENTOS
   ===================================================================== */
let tSalvar;
function mudou(redesenhar){
  S.atualizado = new Date().toISOString(); lsSet(LS_ATUAL, S);
  if (redesenhar) render(); else atualizarTotais();
  $("#tb-status").textContent = `Nº ${S.numero} · rascunho salvo automaticamente`;
}
function aplicarCampo(el){
  const k = el.dataset.k, t = el.dataset.t; let v;
  if (t === "bool") v = el.checked;
  else if (t === "num") v = num(el.value);
  else if (t === "numnull") v = el.value === "" ? null : num(el.value);
  else if (t === "money") v = num(el.value);
  else v = el.value;
  setP(S, k, v);
  const pv = document.querySelector(`[data-pv="${k}"]`);
  if (pv){ pv.textContent = t === "money" ? brl(v) : t === "date" ? dataBR(v) : t === "time" ? (v ? v.replace(":00","h").replace(":","h") : "") : t === "select" ? el.options[el.selectedIndex].text : String(v ?? ""); }
  // regras de preenchimento automático
  const mH = k.match(/^hosp\.(\d+)\.(acomod|tabela|regime|checkin|checkout)$/);
  if (mH){ const r = S.hosp[+mH[1]];
    if (["acomod","tabela","regime"].includes(mH[2])){ const p = TABELA.hospedagem[r.tabela][r.acomod]; if (p){ r.valor = p[r.regime]; r.ref = p[r.regime]; } else { toast("Essa acomodação não existe na tabela Lazer"); r.ref = null; } }
    else { const n = noites(r.checkin, r.checkout); if (n) r.diarias = n; }
    return mudou(true); }
  if (/^hosp\.\d+\.pessoas$/.test(k)){ const r = S.hosp[+k.split(".")[1]]; const cap = TABELA.capacidade[r.acomod]; if (!num(r.qtd) || num(r.qtd) * cap < num(r.pessoas)) { r.qtd = Math.ceil(num(r.pessoas) / cap); const e = document.querySelector(`[data-k="hosp.${k.split(".")[1]}.qtd"]`); if (e) e.value = r.qtd; } }
  if (k === "meta.formato"){ if (S.meta.formato === "pernoite"){ S.meta.checkinHora = "15:00"; S.meta.checkoutHora = "13:00"; } else { S.meta.checkinHora = "08:00"; S.meta.checkoutHora = "22:00"; } return mudou(true); }
  if (k === "meta.checkin" && S.meta.formato === "dayuse" && !S.meta.checkout){ S.meta.checkout = S.meta.checkin; return mudou(true); }
  mudou(["bool","select","date"].includes(t));
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k && el.dataset.t !== "money" && el.dataset.t !== "select" && el.dataset.t !== "bool" && el.dataset.t !== "date") aplicarCampo(el);
  else if (el.dataset.k && el.dataset.t === "money"){ setP(S, el.dataset.k, num(el.value)); mudou(false); }
  else if (el.dataset.ce){ setP(S, el.dataset.ce, el.innerText.replace(/\n$/, "")); S.atualizado = new Date().toISOString(); clearTimeout(tSalvar); tSalvar = setTimeout(() => lsSet(LS_ATUAL, S), 400); }
  else if (el.dataset.brief){ const q = el.dataset.brief; S.briefing[q] = Object.assign({}, S.briefing[q], {n: el.value}); clearTimeout(tSalvar); tSalvar = setTimeout(() => lsSet(LS_ATUAL, S), 400); }
});
document.addEventListener("change", e => { const el = e.target; if (el.dataset.k && ["money","select","bool","date"].includes(el.dataset.t)) aplicarCampo(el); if (el.id === "arq-import") importar(el); });
document.addEventListener("focusin", e => { const el = e.target; if (el.dataset && el.dataset.t === "money"){ const v = num(getP(S, el.dataset.k)); el.value = v ? String(v).replace(".", ",") : ""; el.select(); } });
document.addEventListener("focusout", e => { const el = e.target; if (el.dataset && el.dataset.t === "money"){ el.value = nBR.format(num(getP(S, el.dataset.k))); } if (el.dataset && el.dataset.ce) { lsSet(LS_ATUAL, S); renderPainel(); } });
document.addEventListener("paste", e => { const el = e.target.closest && e.target.closest("[contenteditable]"); if (!el) return; e.preventDefault(); const txt = (e.clipboardData || window.clipboardData).getData("text/plain"); document.execCommand("insertText", false, txt); });

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-aba]"); if (!b) return;
  if (b.dataset.aba){ abaAtual = b.dataset.aba; renderPainel(); return; }
  const a = b.dataset.act;
  if (a === "add") abrirCatalogo(b.dataset.lista);
  else if (a === "fechar-dlg") $("#dlg").close();
  else if (a === "dur"){ dlgDur = b.dataset.dur; desenharCatalogo(); }
  else if (a === "pick") escolher(b.dataset.key);
  else if (a === "rm"){ const L = b.dataset.lista; S[L] = S[L].filter(r => r.id !== b.dataset.id); mudou(true); }
  else if (a === "brief"){ const q = b.dataset.q; const atual = (S.briefing[q] || {}).r; S.briefing[q] = Object.assign({}, S.briefing[q], {r: atual === b.dataset.r ? "" : b.dataset.r}); mudou(false); }
  else if (a === "pdf") exportarPDF();
  else if (a === "salvar"){ salvarNaLista(); toast(`Orçamento ${S.numero} salvo`); renderPainel(); }
  else if (a === "novo"){ salvarNaLista(); S = novoOrcamento(); abaAtual = "briefing"; mudou(true); toast(`Novo orçamento ${S.numero}`); }
  else if (a === "duplicar"){ salvarNaLista(); const c = JSON.parse(JSON.stringify(S)); c.id = uid(); c.numero = proximoNumero(); c.criado = c.atualizado = new Date().toISOString(); c.meta.emissao = hoje(); c.desconto.aprovadoPor = ""; S = c; mudou(true); toast(`Cópia criada: ${S.numero}`); }
  else if (a === "exemplo"){ salvarNaLista(); S = exemplo(); S.id = uid(); mudou(true); toast("Exemplo carregado"); }
  else if (a === "abrir"){ salvarNaLista(); const o = lsGet(LS_LISTA, {})[b.dataset.id]; if (o){ delete o._total; S = o; S.cfg = Object.assign(cfgPadrao(), S.cfg); mudou(true); toast(`Aberto: ${S.numero}`); } }
  else if (a === "excluir"){ const l = lsGet(LS_LISTA, {}); const o = l[b.dataset.id]; if (o && confirm(`Excluir o orçamento ${o.numero} deste navegador?`)){ delete l[b.dataset.id]; lsSet(LS_LISTA, l); renderPainel(); } }
  else if (a === "exportar") exportarJSON();
  else if (a === "importar") $("#arq-import").click();
  else if (a === "textos-padrao"){ if (confirm("Substituir os textos do fim da proposta pelos textos padrão?")){ S.textos = TEXTOS_PADRAO(); mudou(true); } }
});
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });

function salvarNaLista(){ const l = lsGet(LS_LISTA, {}); const c = JSON.parse(JSON.stringify(S)); c._total = calc().total; l[S.id] = c; if (!lsSet(LS_LISTA, l)) toast("Não foi possível salvar neste navegador — use “Baixar arquivo”."); lsSet(LS_ATUAL, S); }
function nomeArquivo(ext){ return `Proposta ${S.numero.replace("/","-")}${S.meta.empresa ? " - " + S.meta.empresa : ""} - Roga Village.${ext}`.replace(/[\\/:*?"<>|]/g, ""); }
function exportarJSON(){ const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nomeArquivo("json"); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function importar(input){ const f = input.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.meta || !Array.isArray(o.ab)) throw 0; salvarNaLista(); S = o; S.cfg = Object.assign(cfgPadrao(), S.cfg); S.briefing = S.briefing || {}; mudou(true); toast(`Aberto: ${S.numero}`); } catch { toast("Arquivo inválido"); } input.value = ""; }; rd.readAsText(f); }
function exportarPDF(){
  const C = calc(); const pend = checagens(C).filter(a => a.nivel === "a");
  if (pend.length && !confirm(`Há ${pend.length} ponto(s) de atenção na aba Checagens.\n\nGerar o PDF mesmo assim?`)){ abaAtual = "checagens"; renderPainel(); return; }
  salvarNaLista(); document.activeElement && document.activeElement.blur();
  document.title = nomeArquivo("pdf").replace(/\.pdf$/, "");
  toast("Na janela de impressão, escolha “Salvar como PDF”"); setTimeout(() => window.print(), 250);
}
window.addEventListener("beforeprint", () => document.querySelectorAll("[data-ce]").forEach(el => { if (!el.innerText.trim()) el.innerHTML = ""; }));

render();
$("#tb-status").textContent = `Nº ${S.numero}`;
</script>
</body>
